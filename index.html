<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>รายงานกลุ่มไชโย–ซีวาย (ต้องใช้รหัสผ่าน)</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f5f1,#141816);--ink:light-dark(#1d2321,#e9ece9);--muted:light-dark(#5f6b66,#9aa5a0);--panel:light-dark(#fff,#1c211f);--line:light-dark(#e3e1da,#2c3330);--acc:light-dark(#1f6f5c,#4fb59a);--bad:light-dark(#b4433a,#e2766c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;padding:20px}
.box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:22px;margin:0 0 4px;line-height:1.3}p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:14px;width:100%;min-height:46px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1.4em}
</style></head><body>
<form class="box" id="f" autocomplete="off">

<label for="pw">รหัสผ่าน</label>
<input id="pw" type="password" autofocus>
<button id="go" type="submit">เปิดรายงาน</button>
<div class="err" id="err" role="alert"></div>
</form>
